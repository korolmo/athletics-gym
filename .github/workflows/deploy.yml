name: Deploy (hoster.kz)

# Выкатка боевого сайта на hoster.kz — только вручную и только релизного тега (ADR 0006, docs/runbooks/release.md).
# Собирает готовое приложение из тега и кладёт его в ветку deploy (ADR 0004, docs/hosting-plesk.md);
# Plesk «Развернуть с помощью Git» забирает ветку deploy.
# Запуск требует подтверждения в GitHub Environments `production` (обязательный ревьюер).
# Merge в main прод НЕ выкатывает: main уходит только в Лабораторию.
# В ветке — только собранные файлы: без исходников, без .env и секретов. Секреты — только в Plesk.
# Ветка перезаписывается одним коммитом без истории: в репозитории хостинга не копятся старые сборки.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Релизный тег (vX.Y.Z), например v1.0.0"
        required: true
        type: string

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: Build ${{ inputs.tag }} and publish to deploy branch
    # Сам workflow — только из main: в старых тегах и hotfix-ветках его версия без защиты
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Сборке база не нужна (страницы с данными собираются по запросу); строка — чтобы Prisma сгенерировала клиент
      DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
      # Заголовки (X-Robots-Tag) вычисляются при сборке: ветка deploy — для боевого хостинга
      APP_ENV: production
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ожидается релизный тег vX.Y.Z, получено: $TAG"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Assemble hosting bundle
        run: node scripts/standalone/assemble.mjs

      - name: Check bundle (no secrets, engines for Linux)
        run: |
          cd dist/hosting
          if find . -name ".env*" | grep -q .; then echo "В сборке есть .env"; exit 1; fi
          ls node_modules/.prisma/client/ | grep -E "libquery_engine-(debian|rhel)-openssl-(1\.1|3\.0)\.x\.so\.node" | wc -l | grep -qx 4
          test -f start.cjs && test -f server.js && test -f prisma/migrations/migration_lock.toml
          du -sh .

      - name: Publish to deploy branch
        run: |
          SHA=$(git rev-parse HEAD)
          cd dist/hosting
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Сборка из ${TAG} (${SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
