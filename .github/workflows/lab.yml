name: Lab (Vercel)

# Лаборатория — проект Vercel athletics-gym-lab (ADR 0006, 0008): merge в main → production Лаборатории,
# каждый PR → превью (адрес — в комментарии к PR). Выкатка из CLI, а не Git-интеграцией Vercel:
# корневой vercel.json выключает Git-деплои, чтобы старый проект athletics-gym (редирект) не собирал main.
# Боевой сайт на hoster.kz этот workflow не трогает.
# Базы (ADR 0012): production Лаборатории — база athletics (DATABASE_URL проекта Vercel, только production);
# превью PR — своя эфемерная база pr_<номер>: пересоздаётся при каждой выкатке, миграции этого PR и seed:lab,
# адрес передаётся только этому деплою. При закрытии PR базу удаляет lab-preview-cleanup.yml.
# После выкатки — смоук живого адреса (scripts/lab/smoke.mjs); для PR — ещё превью с MAINTENANCE_MODE=1 и смоук 503.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Та же группа у lab-preview-cleanup.yml: закрытие PR отменяет его недоделанную выкатку
  group: lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy to Lab (${{ github.event_name == 'push' && 'production' || 'preview' }})
    # PR из форков секретов не получают — им превью не нужно
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_LAB_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check token
        id: token
        env:
          HAS_DB: ${{ secrets.LAB_DATABASE_URL != '' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Нет секрета VERCEL_TOKEN или переменной VERCEL_LAB_PROJECT_ID — выкатка в Лабораторию пропущена"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "$HAS_DB" != "true" ]; then
            # Без своей базы превью не выкатываем: у превью нет DATABASE_URL, а базу production оно трогать не должно
            echo "::warning::Нет секрета LAB_DATABASE_URL — превью пропущено (ADR 0012)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' && steps.token.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Preview database pr_${{ github.event.number }}
        if: github.event_name == 'pull_request' && steps.token.outputs.skip != 'true'
        env:
          LAB_DATABASE_URL: ${{ secrets.LAB_DATABASE_URL }}
          ADMIN_LOGIN: ${{ secrets.LAB_ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.LAB_ADMIN_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          # Лимит баз превью, пересоздание pr_<номер>; адрес — в PREVIEW_DATABASE_URL (под маской)
          node scripts/lab/preview-db.mjs prepare ${{ github.event.number }}
          DATABASE_URL="$(grep '^PREVIEW_DATABASE_URL=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)"
          # Миграции этого PR — тем же migrate.cjs, что на хостинге; данные — seed Лаборатории
          DATABASE_URL="$DATABASE_URL" node scripts/standalone/migrate.cjs
          DATABASE_URL="$DATABASE_URL" APP_ENV=lab npx tsx prisma/seed-lab.ts

      - name: Deploy
        id: deploy
        if: steps.token.outputs.skip != 'true'
        run: |
          # Проект — только из VERCEL_PROJECT_ID: старый athletics-gym сюда не попадёт ни при каких настройках
          test "$VERCEL_PROJECT_ID" != "prj_AfWwCrzvgFoYkV56C2aocZ2DM4AM"
          # production — база athletics из переменных проекта; превью — только своя база pr_<номер>
          PROD=""; DB=()
          if [ "${{ github.event_name }}" = "push" ]; then PROD="--prod"; else DB=(--env "DATABASE_URL=$PREVIEW_DATABASE_URL"); fi
          URL=$(npx --yes vercel@50.4.9 deploy $PROD --yes --token "$VERCEL_TOKEN" "${DB[@]}" \
            --meta githubCommitSha=${{ github.sha }} --env RELEASE=${{ github.sha }} --build-env RELEASE=${{ github.sha }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Лаборатория: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Cold start (ADR 0011)
        # Сразу после выкатки production первый запрос поднимает новый экземпляр функции.
        # Адрес — алиас Лаборатории: уникальные адреса деплоев закрыты защитой Vercel
        if: github.event_name == 'push' && steps.deploy.outputs.url
        continue-on-error: true
        run: node scripts/monitor/cold-start.mjs "${{ vars.LAB_URL || 'https://athletics-gym-lab.vercel.app' }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          MARK="<!-- lab-preview -->"
          BODY="$MARK
          Превью Лаборатории: $URL (коммит ${{ github.event.pull_request.head.sha }}; база pr_${{ github.event.number }} — seed:lab, удалится при закрытии PR)"
          ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" -f body="$BODY" > /dev/null
          fi

      - name: Smoke (ADR 0005, 0013)
        # Живой адрес после выкатки: CDN Vercel и её встроенные страницы ошибок прод-двойник не видит. Красный смоук —
        # выкатка неуспешна. production — алиас Лаборатории (после замера холодного старта, чтобы его не прогреть);
        # превью — через vercel curl: уникальные адреса закрыты защитой Vercel
        if: steps.deploy.outputs.url
        env:
          URL: ${{ steps.deploy.outputs.url }}
          LAB_URL: ${{ vars.LAB_URL || 'https://athletics-gym-lab.vercel.app' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/lab/smoke.mjs "$LAB_URL"
          else
            SMOKE_VERCEL_CURL=1 node scripts/lab/smoke.mjs "$URL"
          fi

  maintenance:
    # Технические работы (MAINTENANCE_MODE=1) — только на отдельном превью PR, не на production Лаборатории.
    # Без базы: страница 503 из middleware её не читает, а базу production превью трогать не должно (ADR 0012)
    name: Lab preview — maintenance 503
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_LAB_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Нет секрета VERCEL_TOKEN или переменной VERCEL_LAB_PROJECT_ID — превью с техническими работами пропущено"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != true

      - uses: actions/setup-node@v4
        if: steps.token.outputs.skip != true
        with:
          node-version: 22

      - name: Deploy preview (MAINTENANCE_MODE=1)
        id: deploy
        if: steps.token.outputs.skip != true
        run: |
          test "$VERCEL_PROJECT_ID" != "prj_AfWwCrzvgFoYkV56C2aocZ2DM4AM"
          URL=$(npx --yes vercel@50.4.9 deploy --yes --token "$VERCEL_TOKEN" --env MAINTENANCE_MODE=1 --meta githubCommitSha=${{ github.sha }} --env RELEASE=${{ github.sha }} --build-env RELEASE=${{ github.sha }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Превью с техническими работами: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke --maintenance
        if: steps.deploy.outputs.url
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: SMOKE_VERCEL_CURL=1 node scripts/lab/smoke.mjs "$URL" --maintenance
