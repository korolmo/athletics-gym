name: Outbox (Lab)

# Отправщик очереди уведомлений Владельца (ADR 0017) по расписанию: повторы с растущей паузой и то, что не ушло
# сразу после ответа Клиенту. Только Лаборатория: боевой сайт этот workflow не трогает (ADR 0006).
# Секрет CRON_SECRET — тот же, что в переменных проекта Vercel athletics-gym-lab; без него проход пропускается.
# Cron GitHub бывает редким и запаздывает (этап 0, ADR 0014): задержка повторов — до интервала cron, это допустимо.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outbox-lab
  cancel-in-progress: false

jobs:
  deliver:
    name: Deliver pending notifications
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/cron/outbox
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LAB_URL: ${{ vars.LAB_URL || 'https://athletics-gym-lab.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Нет секрета CRON_SECRET — отправщик очереди не вызван"
            exit 0
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$LAB_URL/api/cron/outbox")
          echo "HTTP $code: $(cat body.json)"
          echo "Отправщик: HTTP $code — $(cat body.json)" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "200"
