name: Monitor Lab

# Мониторинг Лаборатории (ADR 0014): проверки делает UptimeRobot каждые 5 минут (/ru и /kk с ключевым словом —
# SLO, /api/health/ready — диагностика). Раз в сутки этот workflow забирает их через API и пересчитывает status.json
# и страницу статуса в ветке monitoring (не main). От расписания GitHub SLO больше не зависит: окно выборки — 72 часа,
# пропущенный запуск доберёт следующий. Красный запуск — тревога (выгорание бюджета, мало проверок, старые данные):
# GitHub присылает письмо. Боевой сайт athleticsgym.kz не проверяется: скрипты отказываются работать с его адресом.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: monitor-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    name: UptimeRobot → status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAB_URL: ${{ vars.LAB_URL || 'https://athletics-gym-lab.vercel.app' }}
      UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/monitor

      - uses: actions/checkout@v4
        with:
          ref: monitoring
          path: mon

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch UptimeRobot
        run: |
          if [ -z "$UPTIMEROBOT_API_KEY" ]; then
            # Без ключа данных нет: отчёт ниже покажет «данные устарели» и сделает запуск красным
            echo "::error::Нет секрета UPTIMEROBOT_API_KEY — проверки UptimeRobot не получены"
          else
            node scripts/monitor/uptimerobot-fetch.mjs mon 72
          fi

      - name: SLI, budget, status page
        id: report
        run: node scripts/monitor/report.mjs mon || echo "alert=true" >> "$GITHUB_OUTPUT"

      - name: Commit to monitoring branch
        run: |
          cd mon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Отчёт $(date -u +%Y-%m-%dT%H:%MZ)"
          for _ in 1 2 3; do
            git push -q origin HEAD:monitoring && break
            git pull -q --rebase origin monitoring
          done

      - name: Alert
        if: steps.report.outputs.alert == 'true'
        run: |
          echo "::error::Тревога мониторинга Лаборатории — причины в сводке шага «SLI, budget, status page»"
          exit 1
