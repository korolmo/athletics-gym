# Локальная база как на хостинге hoster.kz: MariaDB 10.4 (ADR 0004).
# Запуск: docker compose up -d. Строка подключения — в .env.example.
services:
  mariadb:
    image: mariadb:10.4
    container_name: athletics-gym-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: athletics
      MARIADB_USER: athletics
      MARIADB_PASSWORD: athletics
    # Как на хостинге: utf8mb4 и время сервера в UTC (Prisma пишет даты в UTC)
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Прод-двойник (ADR 0005): лимиты тарифа hoster.kz «Эконом-1» — 256 МБ без подкачки, 1 CPU, MariaDB 10.4,
  # запуск как в Plesk — node start.cjs из собранного dist/hosting (сначала миграции, потом сервер).
  # Не стартует без профиля: docker compose --profile twin up -d. Замер и проверки — npm run twin:measure.
  twin-db:
    profiles: [twin]
    image: mariadb:10.4
    environment:
      MARIADB_ROOT_PASSWORD: twin
      MARIADB_DATABASE: athletics
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "3308:3306"
    # Одноразовая база: данные — из seed при каждом замере
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptwin"]
      interval: 3s
      timeout: 3s
      retries: 40

  twin-app:
    profiles: [twin]
    # Node на хостинге — 23.11 (Plesk)
    image: node:23.11.0-bookworm-slim
    depends_on:
      twin-db:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    working_dir: /app
    command: ["node", "start.cjs"]
    environment:
      NODE_ENV: production
      # Как в Plesk (docs/hosting-plesk.md)
      NODE_OPTIONS: --max-old-space-size=160
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://root:twin@twin-db:3306/athletics
      AUTH_SECRET: twin-auth-secret-only-for-local-docker-0000
      STORAGE_DRIVER: local
      MEDIA_DIR: /media
      APP_ENV: twin
      RELEASE: ${RELEASE:-twin}
    ports:
      - "3300:3000"
    volumes:
      - ./dist/hosting:/app
      - twin-media:/media

volumes:
  mariadb-data:
  twin-media:
