name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    # Workflow проверяются до выкатки (этап 0, ретро): lab.yml дважды не запустился из-за кавычек.
    # actionlint сам гоняет shellcheck по шагам run (shellcheck есть на ubuntu-latest).
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint 1.7.7
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: Check workflows
        run: ./actionlint -color

  boundaries:
    # Границы кода (этап 6, ADR 0015): новое нарушение — ошибка; известные — в
    # .dependency-cruiser-known-violations.json, их число убывает с каждым перенесённым модулем.
    name: Dependency boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check boundaries
        run: npm run deps:check

      - name: Graph
        if: always()
        run: |
          known=$(node -p "require('./.dependency-cruiser-known-violations.json').length")
          {
            echo "### Границы кода"
            echo "Известных нарушений: **${known}** (цель этапа 6 — 0)."
            echo
            echo '```mermaid'
            npm run -s deps:graph
            echo '```'
          } > deps-graph.md
          cat deps-graph.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-graph
          path: deps-graph.md
          if-no-files-found: ignore

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Как на хостинге hoster.kz: MariaDB 10.4 (ADR 0004)
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: athletics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/athletics
      # Интеграционные тесты удаляют все таблицы — у них своя база
      TEST_DATABASE_URL: mysql://root:ci@127.0.0.1:3306/athletics_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test database
        run: |
          docker exec ${{ job.services.mariadb.id }} mysql -uroot -pci \
            -e "CREATE DATABASE athletics_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Test (unit + MariaDB)
        run: npm test

      - name: Migrations and seed on MariaDB
        run: |
          node scripts/standalone/migrate.cjs
          npm run seed
          npx prisma migrate status

      - name: Build
        run: npm run build

      - name: Hosting bundle
        run: node scripts/standalone/assemble.mjs

  twin:
    # Прод-двойник (ADR 0005): собранный пакет для hoster.kz в Docker с лимитами хостинга —
    # 256 МБ без подкачки, 1 CPU, Node 23.11, MariaDB 10.4, запуск через start.cjs.
    # Падает, если RSS процесса > 230 МБ, есть 5xx/обрывы или контейнер убит за память.
    name: Prod twin (256 MB, 1 CPU, MariaDB 10.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build hosting bundle
        run: |
          npm run build
          node scripts/standalone/assemble.mjs

      - name: Measure and check
        run: npm run twin:measure -- --check

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-report
          path: dist/twin-report.json
          if-no-files-found: ignore
